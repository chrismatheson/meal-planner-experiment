name: MealPlanner
options:
  bundleIdPrefix: com.mealplanner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  MealPlanner-iOS:
    type: application
    platform: iOS
    sources:
      - path: MealPlanner
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app
        PRODUCT_NAME: MealPlanner
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealPlanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    entitlements:
      path: MealPlanner/MealPlanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mealplanner.app

  MealPlanner-macOS:
    type: application
    platform: macOS
    sources:
      - path: MealPlanner
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app
        PRODUCT_NAME: MealPlanner
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealPlanner
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
    entitlements:
      path: MealPlanner/MealPlanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mealplanner.app

  MealPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealPlannerTests
    dependencies:
      - target: MealPlanner-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MealPlanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MealPlanner"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MealPlannerTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MealPlannerTests
    dependencies:
      - target: MealPlanner-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app.tests
        GENERATE_INFOPLIST_FILE: YES

  MealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MealPlannerUITests
    dependencies:
      - target: MealPlanner-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MealPlanner-iOS:
    build:
      targets:
        MealPlanner-iOS: all
        MealPlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealPlannerTests
        - MealPlannerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MealPlanner-macOS:
    build:
      targets:
        MealPlanner-macOS: all
        MealPlannerTests-macOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealPlannerTests-macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
