name: MealPlanner
options:
  bundleIdPrefix: com.mealplanner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MealPlanner:
    type: application
    platform: iOS
    sources:
      - path: MealPlanner
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    entitlements:
      path: MealPlanner/MealPlanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.mealplanner.app

  MealPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealPlannerTests
    dependencies:
      - target: MealPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealplanner.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MealPlanner:
    build:
      targets:
        MealPlanner: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealPlannerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
