name: MealPlanner
options:
  bundleIdPrefix: com.curleybracketsengineering
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  PaprikaPlanner:
    type: application
    platform: iOS
    sources:
      - path: MealPlanner
        excludes:
          - "**/*.md"
    info:
      path: MealPlanner/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            s3.amazonaws.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curleybracketsengineering.paprikaplanner
        PRODUCT_NAME: paprikaplanner
        PRODUCT_MODULE_NAME: paprikaplanner
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: 92
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealPlanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HH2SVYXX2D
    entitlements:
      path: MealPlanner/MealPlanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.curleybracketsengineering.paprikaplanner

  PaprikaPlanner-macOS:
    type: application
    platform: macOS
    sources:
      - path: MealPlanner
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curleybracketsengineering.paprikaplanner
        PRODUCT_NAME: paprikaplanner
        PRODUCT_MODULE_NAME: paprikaplanner
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: 92
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealPlanner
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HH2SVYXX2D
    entitlements:
      path: MealPlanner/MealPlanner.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.curleybracketsengineering.paprikaplanner

  MealPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealPlannerTests
    dependencies:
      - target: PaprikaPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curleybracketsengineering.paprikaplanner.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/paprikaplanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/paprikaplanner"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MealPlannerTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MealPlannerTests
    dependencies:
      - target: PaprikaPlanner-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curleybracketsengineering.paprikaplanner.tests
        GENERATE_INFOPLIST_FILE: YES

  MealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MealPlannerUITests
    dependencies:
      - target: PaprikaPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.curleybracketsengineering.paprikaplanner.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PaprikaPlanner:
    build:
      targets:
        PaprikaPlanner: all
        MealPlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealPlannerTests
        - MealPlannerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PaprikaPlanner-macOS:
    build:
      targets:
        PaprikaPlanner-macOS: all
        MealPlannerTests-macOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealPlannerTests-macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
